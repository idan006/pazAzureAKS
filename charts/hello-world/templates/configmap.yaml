apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hello-world.fullname" . }}-content
  labels:
    {{- include "hello-world.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>{{ .Values.website.title }}</title>
      <style>
        :root {
          color-scheme: light dark;
          font-family: Arial, Helvetica, sans-serif;
        }
        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: #f5f7fa;
          color: #172033;
        }
        main {
          width: min(720px, calc(100% - 32px));
          border: 1px solid #d8dee9;
          border-radius: 8px;
          padding: 40px;
          background: #ffffff;
          box-shadow: 0 12px 30px rgba(23, 32, 51, 0.08);
        }
        h1 {
          margin: 0 0 12px;
          font-size: 40px;
          line-height: 1.1;
        }
        p {
          margin: 0;
          font-size: 18px;
          line-height: 1.6;
        }
        @media (prefers-color-scheme: dark) {
          body {
            background: #111827;
            color: #f8fafc;
          }
          main {
            background: #1f2937;
            border-color: #374151;
          }
        }
      </style>
    </head>
    <body>
      <main>
        <h1>{{ .Values.website.heading }}</h1>
        <p>{{ .Values.website.message }}</p>
      </main>
    </body>
    </html>
